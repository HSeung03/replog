name: Deploy to AWS EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials # 깃허브 액션이 aws에 접근하려면 인증된 사용자임을 증명해야함
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR # ecr에 로그인함 ecr은 aws가 제공하는 이미지 저장손데 aws판이라고 생각하면 됨
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image # 깃허브 액션이 ecr에 두개의 이미지를 올리려고 함
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }} # 한개는 최신 한개는 올리려고 하는거 이유는 하나 버그발생하면 롤백해야하니까
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/replog-backend:$IMAGE_TAG -t $ECR_REGISTRY/replog-backend:latest ./backend
          docker push $ECR_REGISTRY/replog-backend:$IMAGE_TAG 
          docker push $ECR_REGISTRY/replog-backend:latest

      - name: Deploy to EC2 # ec2에 접속하려고 하는 것 script안의 명령어는 모두 ec2에서 동작
        uses: appleboy/ssh-action@v1.0.0 
        with:
          # ec2 주소. 서울(ap-northeast-2) 인스턴스에 Elastic IP를 붙여 두었으므로
          # 인스턴스를 중지·재기동해도 주소가 바뀌지 않는다. EC2_HOST secret을
          # 넣어두면 그걸 쓰고, 없으면 Elastic IP로 떨어진다.
          host: ${{ secrets.EC2_HOST || '43.200.132.77' }}
          username: ubuntu # ec2에 접속하는 계정
          key: ${{ secrets.EC2_SSH_KEY }} # secrets에 저장해둔 ssh프라이빗 키 
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY # 환경변수로 ec2에게 넘김 나중에 이 키로 비밀번호를 꺼내와서 aws에 인증후 ecr에 접속하는거임
          # ec2가 ecr에서 이미지를 풀하려면 ec2도 ecr에 로그인 해야함
          # aws ecr get-login-password(금고에서 비번 꺼내고) (|)파이프로 docker login--password-stdin여기에 전달하는 명령어
          # docker stop , rm || true 이거는 있으면 해당 명령어 실행 없어도 그냥 성공처리하고 넘어가란 뜻임
          # docker run -d -d 는 백그라운드에서 실행하라는 뜻임 --name은 컨테이너 이름 지정 -p는 포트연결
          # -v 은 볼륨인데 .env와 storage로 관리됨 env는 중요하니까 보안처리로 따로 두는거임 볼륨을 
          # storage는 유저가 올린 pdf나 이미지 영상등을 저장하는 공간임 db에는 그 경로만 저장되는 거고
          # 그다음은 백엔드 클리어 새 컨테이너로 교체하면서 캐시 찌꺼기가 남아있을수도 있음
          script: |
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=ap-northeast-2
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
            set -e
            REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
            IMAGE=$REGISTRY/replog-backend:latest

            # 지금 돌고 있는 이미지를 기억해둔다. 새 이미지가 안 뜨면 이걸로 되돌린다.
            PREVIOUS=$(docker inspect --format='{{.Image}}' replog-backend 2>/dev/null || echo "")

            docker pull $IMAGE

            start_container() {
              docker rm -f replog-backend >/dev/null 2>&1 || true
              docker run -d \
                --name replog-backend \
                -p 9000:9000 \
                --restart unless-stopped \
                -v /var/www/replog/backend/.env:/var/www/html/.env \
                -v /var/www/replog/backend/storage:/var/www/html/storage \
                "$1"
            }

            start_container "$IMAGE"

            # 컨테이너가 실제로 떠 있는지 확인한 뒤에 migrate로 넘어간다.
            # 예전에는 확인 없이 docker exec를 바로 실행해서, 이미지가 깨져
            # 있으면 exec만 실패하고 워크플로는 성공으로 끝나면서 서비스는
            # 내려간 상태로 남았다.
            for i in $(seq 1 15); do
              if [ "$(docker inspect -f '{{.State.Running}}' replog-backend 2>/dev/null)" = "true" ] \
                 && docker exec replog-backend php artisan --version >/dev/null 2>&1; then
                echo "container is up"
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ -z "$HEALTHY" ]; then
              echo "새 컨테이너가 뜨지 않았습니다. 로그:"
              docker logs --tail 50 replog-backend || true

              if [ -n "$PREVIOUS" ]; then
                echo "이전 이미지로 되돌립니다: $PREVIOUS"
                start_container "$PREVIOUS"
              fi
              exit 1
            fi

            docker exec replog-backend php artisan migrate --force
            docker exec replog-backend php artisan config:clear
            docker exec replog-backend php artisan cache:clear
            docker exec replog-backend php artisan route:clear
